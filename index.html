<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SS27 Timeline</title>
</head>
<body style="margin:0;background:#121211;color:#a29f98;font:15px system-ui,sans-serif;padding:32px 16px">
<p id="msg">Loading SS27 Timeline…</p>
<script>
var FEED = 'https://script.google.com/macros/s/AKfycbxHyBeB47kbekwHgRmij48WzzYNP8z_hjtv8jvWpM5mIGuiun6qGX3o33mxuQNCqfg/exec';
fetch(FEED + '?format=page', { credentials: 'omit' })
  .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); return r.text(); })
  .then(function (html) {
    html = html.replace('<head>', '<head><script>window.SS27_FEED = ' + JSON.stringify(FEED) + ';<\/script>');
    document.open(); document.write(html); document.close();
  })
  .catch(function (e) {
    document.getElementById('msg').textContent = 'SS27 Timeline could not load (' + e.message + '). Reload the page to try again.';
  });
</script>
</body>
</html>
