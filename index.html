<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SS27 Timeline</title>
</head>
<body style="margin:0;background:#121211;color:#a29f98;font:15px system-ui,sans-serif;padding:32px 16px">
<p id="msg">Loading SS27 Timeline… This can take up to a minute.</p>
<script>
var FEED = 'https://script.google.com/macros/s/AKfycbxHyBeB47kbekwHgRmij48WzzYNP8z_hjtv8jvWpM5mIGuiun6qGX3o33mxuQNCqfg/exec';
var D3 = 'https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js';
function get(url) {
  return fetch(url, { credentials: 'omit' }).then(function (r) {
    if (!r.ok) throw new Error('status ' + r.status);
    return r.text();
  });
}
Promise.all([get(FEED + '?format=page'), get(D3)])
  .then(function (res) {
    var html = res[0], d3code = res[1].replace(/<\/script/gi, '<\\/script');
    html = html.replace('<script src="' + D3 + '"><\/script>', function () { return '<script>' + d3code + '<\/script>'; });
    html = html.replace('<head>', '<head><script>window.SS27_FEED = ' + JSON.stringify(FEED) + ';<\/script>');
    document.open(); document.write(html); document.close();
  })
  .catch(function (e) {
    document.getElementById('msg').textContent = 'SS27 Timeline could not load (' + e.message + '). Reload the page to try again.';
  });
</script>
</body>
</html>
